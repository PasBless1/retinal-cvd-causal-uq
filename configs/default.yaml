# ============================================================================
# Configuration for the Retinal CVD Causal + UQ pipeline.
# Every tunable parameter lives here so experiments are reproducible.
# ============================================================================

seed: 42

data:
  # Root directory containing the extracted mBRSET dataset.
  # Expected to contain an images directory and a metadata CSV.
  root: data/mbrset
  images_subdir: images
  metadata_csv: metadata.csv
  image_size: 512            # images are resized to image_size x image_size
  # Column names in the mBRSET metadata CSV. Adjust to match the real file
  # once downloaded (the loader will warn if a column is missing and fall
  # back to sensible defaults).
  columns:
    patient_id: patient_id
    age: age
    sex: sex
    diabetes_time: dm_time          # years since diabetes diagnosis
    insulin: insulin
    systolic_bp: systolic_bp        # may be absent -> imputed
    ldl: ldl_cholesterol            # may be absent -> imputed

segmentation:
  model: bayesian_unet       # one of: bayesian_unet | mc_dropout_unet
  base_channels: 32
  mc_samples: 20             # Monte Carlo forward passes at inference
  dropout_p: 0.3             # only used by mc_dropout_unet
  epochs: 20                  # demo default; raise for real training
  batch_size: 8
  lr: 0.001
  # If a checkpoint exists it is loaded instead of training from scratch.
  checkpoint: outputs/bayesian_unet.pt

features:
  # Threshold applied to the soft vessel probability map.
  vessel_threshold: 0.5
  fractal_box_sizes: [2, 4, 8, 16, 32, 64]

causal:
  # Retinal features treated as exposures (X) in the mediation models.
  exposures:
    - vessel_density
    - fractal_dimension
    - tortuosity
    - vessel_width_mean
  # Clinical mediators (M) on the causal path X -> M -> Y.
  mediators:
    - systolic_bp
    - ldl_cholesterol
  # Confounders adjusted for in both mediator and outcome models.
  confounders:
    - age
    - sex
    - diabetes_time
  outcome: cvd_risk
  bootstrap_iterations: 1000   # for mediation effect confidence intervals

uncertainty:
  # Split-conformal miscoverage rate. alpha=0.1 -> 90% intervals.
  alpha: 0.1
  calibration_fraction: 0.35   # larger cal set -> more stable quantile
  test_fraction: 0.15

labels:
  # Synthetic CVD risk label generation (used when no real outcome column
  # is present). Coefficients loosely follow Framingham-style weighting.
  enabled: true
  binary_threshold: 20.0      # cvd_risk > threshold -> positive class

output:
  dir: outputs
  save_intermediate: true
